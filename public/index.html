<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TempLine — SMS &amp; Temp Mail</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b1120;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }
    .container { max-width: 820px; margin: 0 auto; }
    h1 { margin: 0 0 6px; font-size: 1.6rem; }
    .meta { color: #94a3b8; font-size: 0.88rem; }
    .tabs { display: flex; gap: 8px; margin: 16px 0; }
    .tab-btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #cbd5e1;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    select, input {
      flex: 1 1 100%;
      min-width: 0;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
    }
    .row > select { flex: 1 1 220px; }
    button.action {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #334155; }
    .msg {
      border-top: 1px solid #334155;
      padding-top: 12px;
      margin-top: 12px;
    }
    .msg:first-child { border-top: none; padding-top: 0; margin-top: 0; }
    .code-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .code {
      background: #064e3b;
      color: #6ee7b7;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .copy-btn {
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
      cursor: pointer;
      font-size: 0.82rem;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      margin: 8px 0 0;
      font-size: 0.9rem;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>TempLine Inbox</h1>
    <p class="meta">Temporary SMS &amp; email OTP inbox. Avoid using for banking, personal, or sensitive accounts.</p>

    <div class="tabs">
      <button id="tabSms" class="tab-btn active" type="button">SMS Inbox</button>
      <button id="tabMail" class="tab-btn" type="button">Temp Mail</button>
    </div>

    <section id="smsSection">
      <div class="card">
        <label for="phoneSelect"><strong>Active Phone Number</strong></label>
        <div class="row">
          <select id="phoneSelect">
            <option value="+17372508034">+17372508034</option>
          </select>
          <button id="refreshSmsBtn" class="action" type="button">Refresh SMS</button>
        </div>
      </div>
      <div class="card">
        <strong>SMS Messages</strong>
        <div id="smsList"><p class="meta">Loading...</p></div>
      </div>
    </section>

    <section id="mailSection" class="hidden">
      <div class="card">
        <label for="savedMailSelect"><strong>Select From 50+ Active Email Addresses</strong></label>
        <div class="row">
          <select id="savedMailSelect"></select>
          <button id="nextMailBtn" class="action secondary" type="button">Next Address</button>
          <button id="copyMailBtn" class="action" type="button">Copy Email</button>
        </div>
        <div class="row">
          <input id="mailAddressInput" type="email" placeholder="Or enter custom address..." />
          <button id="saveMailBtn" class="action secondary" type="button">Save</button>
          <button id="refreshMailBtn" class="action secondary" type="button">Refresh Now</button>
          <button id="showAllMailBtn" class="action secondary" type="button">Show All Emails</button>
        </div>
        <p class="meta" style="margin-bottom:0;">51 active real addresses loaded • Auto-refresh: ON (every 5s)</p>
      </div>

      <div class="card">
        <strong>Incoming Verification Emails &amp; OTPs</strong>
        <div id="mailList"><p class="meta">Waiting for incoming emails...</p></div>
      </div>
    </section>
  </div>

  <script>
    const BASE_USER = 'averagedate33';
    const BASE_DOMAIN = 'agentmail.to';
    const STORAGE_KEY = 'templine_saved_emails_v2';

    const DEFAULT_ADDRESSES = [
      `${BASE_USER}@${BASE_DOMAIN}`,
      ...Array.from({ length: 50 }, (_, i) => {
        const num = String(i + 1).padStart(2, '0');
        return `${BASE_USER}+mail${num}@${BASE_DOMAIN}`;
      }),
    ];

    const tabSms = document.getElementById('tabSms');
    const tabMail = document.getElementById('tabMail');
    const smsSection = document.getElementById('smsSection');
    const mailSection = document.getElementById('mailSection');
    const phoneSelect = document.getElementById('phoneSelect');
    const smsList = document.getElementById('smsList');
    const mailAddressInput = document.getElementById('mailAddressInput');
    const savedMailSelect = document.getElementById('savedMailSelect');
    const mailList = document.getElementById('mailList');

    let activeChannel = 'sms';
    let showAllMail = false;
    let pollTimer = null;

    function escapeHtml(str = '') {
      return String(str).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? String(iso || '') : d.toLocaleString();
    }

    function getAllAddresses() {
      let custom = [];
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        if (Array.isArray(parsed)) custom = parsed;
      } catch (_) {}
      return Array.from(new Set([...DEFAULT_ADDRESSES, ...custom]));
    }

    function saveCustomAddress(addr) {
      const clean = String(addr || '').trim().toLowerCase();
      if (!clean) return;
      const list = getAllAddresses();
      if (!list.includes(clean)) {
        list.push(clean);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      }
      renderAddressDropdown(clean);
    }

    function renderAddressDropdown(selected = '') {
      const list = getAllAddresses();
      savedMailSelect.innerHTML = list
        .map((addr, idx) => `<option value="${escapeHtml(addr)}">#${idx + 1} — ${escapeHtml(addr)}</option>`)
        .join('');
      if (selected && list.includes(selected)) {
        savedMailSelect.value = selected;
      }
    }

    function renderMessages(targetEl, items, isEmail) {
      if (!items || items.length === 0) {
        targetEl.innerHTML = `<p class="meta">${isEmail ? 'No emails received yet for this address.' : 'No SMS messages yet.'}</p>`;
        return;
      }
      targetEl.innerHTML = items.map((m) => `
        <div class="msg">
          ${isEmail ? `<div><strong>${escapeHtml(m.subject || '(No Subject)')}</strong></div>` : ''}
          <div class="meta">From: ${escapeHtml(m.from)} • To: ${escapeHtml(m.to || '(not provided)')} • ${escapeHtml(formatDate(m.receivedAt))}</div>
          ${m.code ? `
            <div class="code-row">
              <span class="code">OTP / Code: ${escapeHtml(m.code)}</span>
              <button class="copy-btn" type="button" data-code="${escapeHtml(m.code)}">Copy Code</button>
            </div>
          ` : ''}
          <pre>${escapeHtml(m.body)}</pre>
        </div>
      `).join('');

      targetEl.querySelectorAll('.copy-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          await navigator.clipboard.writeText(btn.dataset.code);
          btn.textContent = 'Copied!';
          setTimeout(() => { btn.textContent = 'Copy Code'; }, 1200);
        });
      });
    }

    async function loadConfig() {
      try {
        const res = await fetch('/api/config');
        const data = await res.json();
        if (Array.isArray(data.phoneNumbers) && data.phoneNumbers.length > 0) {
          phoneSelect.innerHTML = data.phoneNumbers
            .map((num) => `<option value="${escapeHtml(num)}">${escapeHtml(num)}</option>`)
            .join('');
        }
      } catch (_) {}
    }

    async function loadSms() {
      const phone = encodeURIComponent(phoneSelect.value.trim());
      const res = await fetch(`/api/messages?channel=sms&recipient=${phone}`);
      const data = await res.json();
      renderMessages(smsList, data.messages, false);
    }

    async function loadMail() {
      const addr = mailAddressInput.value.trim().toLowerCase();
      const url = (!showAllMail && addr)
        ? `/api/messages?channel=email&recipient=${encodeURIComponent(addr)}`
        : '/api/messages?channel=email';
      const res = await fetch(url);
      const data = await res.json();
      renderMessages(mailList, data.messages, true);
    }

    function startMailPolling() {
      stopMailPolling();
      pollTimer = setInterval(() => {
        if (activeChannel === 'email' && document.visibilityState === 'visible') {
          loadMail();
        }
      }, 5000);
    }

    function stopMailPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    function setTab(channel) {
      activeChannel = channel;
      const isSms = channel === 'sms';
      tabSms.classList.toggle('active', isSms);
      tabMail.classList.toggle('active', !isSms);
      smsSection.classList.toggle('hidden', !isSms);
      mailSection.classList.toggle('hidden', isSms);
      if (isSms) {
        stopMailPolling();
        loadSms();
      } else {
        loadMail();
        startMailPolling();
      }
    }

    tabSms.addEventListener('click', () => setTab('sms'));
    tabMail.addEventListener('click', () => setTab('email'));
    phoneSelect.addEventListener('change', loadSms);
    document.getElementById('refreshSmsBtn').addEventListener('click', loadSms);

    savedMailSelect.addEventListener('change', () => {
      showAllMail = false;
      mailAddressInput.value = savedMailSelect.value;
      loadMail();
    });

    document.getElementById('nextMailBtn').addEventListener('click', () => {
      const nextIdx = (savedMailSelect.selectedIndex + 1) % savedMailSelect.options.length;
      savedMailSelect.selectedIndex = nextIdx;
      showAllMail = false;
      mailAddressInput.value = savedMailSelect.value;
      loadMail();
    });

    document.getElementById('saveMailBtn').addEventListener('click', () => {
      showAllMail = false;
      saveCustomAddress(mailAddressInput.value);
      loadMail();
    });

    document.getElementById('showAllMailBtn').addEventListener('click', () => {
      showAllMail = true;
      loadMail();
    });

    document.getElementById('copyMailBtn').addEventListener('click', async (e) => {
      const val = mailAddressInput.value.trim();
      if (!val) return;
      await navigator.clipboard.writeText(val);
      e.target.textContent = 'Copied!';
      setTimeout(() => { e.target.textContent = 'Copy Email'; }, 1200);
    });

    document.getElementById('refreshMailBtn').addEventListener('click', () => {
      loadMail();
    });

    mailAddressInput.addEventListener('input', () => {
      showAllMail = false;
    });

    (async function init() {
      const first = DEFAULT_ADDRESSES[0];
      renderAddressDropdown(first);
      mailAddressInput.value = first;
      await loadConfig();
      await loadSms();
    })();
  </script>
</body>
</html>
