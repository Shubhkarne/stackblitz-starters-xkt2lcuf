<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>TempLine SMS</title>
        <style>
            * { box-sizing: border-box; }
                body {
                      margin: 0;
                            font-family: system-ui, -apple-system, sans-serif;
                                  background: #0b0f17;
                                        color: #f3f4f6;
                                              padding: 16px;
                                                  }
                                                      .container {
                                                            max-width: 840px;
                                                                  margin: 0 auto;
                                                                      }
                                                                          .header {
                                                                                display: flex;
                                                                                      flex-wrap: wrap;
                                                                                            justify-content: space-between;
                                                                                                  align-items: center;
                                                                                                        gap: 8px;
                                                                                                              margin-bottom: 16px;
                                                                                                                  }
                                                                                                                      .card {
                                                                                                                            background: #131a26;
                                                                                                                                  border: 1px solid #243044;
                                                                                                                                        border-radius: 12px;
                                                                                                                                              padding: 14px;
                                                                                                                                                    margin-bottom: 16px;
                                                                                                                                                        }
                                                                                                                                                            .controls {
                                                                                                                                                                  display: flex;
                                                                                                                                                                        flex-direction: column;
                                                                                                                                                                              gap: 10px;
                                                                                                                                                                                    margin-bottom: 12px;
                                                                                                                                                                                        }
                                                                                                                                                                                            @media (min-width: 600px) {
                                                                                                                                                                                                  .controls {
                                                                                                                                                                                                          flex-direction: row;
                                                                                                                                                                                                                  align-items: center;
                                                                                                                                                                                                                        }
                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                input, button {
                                                                                                                                                                                                                                      border-radius: 8px;
                                                                                                                                                                                                                                            border: 1px solid #2d3b55;
                                                                                                                                                                                                                                                  font-size: 15px;
                                                                                                                                                                                                                                                        padding: 10px 12px;
                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                input {
                                                                                                                                                                                                                                                                      flex: 1;
                                                                                                                                                                                                                                                                            background: #0b0f17;
                                                                                                                                                                                                                                                                                  color: #f3f4f6;
                                                                                                                                                                                                                                                                                        width: 100%;
                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                button {
                                                                                                                                                                                                                                                                                                      background: #2563eb;
                                                                                                                                                                                                                                                                                                            color: #ffffff;
                                                                                                                                                                                                                                                                                                                  border: none;
                                                                                                                                                                                                                                                                                                                        cursor: pointer;
                                                                                                                                                                                                                                                                                                                              font-weight: 600;
                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                      button.secondary {
                                                                                                                                                                                                                                                                                                                                            background: #1f2937;
                                                                                                                                                                                                                                                                                                                                                  border: 1px solid #374151;
                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                          .numbers-grid {
                                                                                                                                                                                                                                                                                                                                                                display: grid;
                                                                                                                                                                                                                                                                                                                                                                      grid-template-columns: 1fr;
                                                                                                                                                                                                                                                                                                                                                                            gap: 10px;
                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                    @media (min-width: 600px) {
                                                                                                                                                                                                                                                                                                                                                                                          .numbers-grid {
                                                                                                                                                                                                                                                                                                                                                                                                  grid-template-columns: repeat(2, 1fr);
                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                .num-item {
                                                                                                                                                                                                                                                                                                                                                                                                                      background: #0b0f17;
                                                                                                                                                                                                                                                                                                                                                                                                                            border: 1px solid #243044;
                                                                                                                                                                                                                                                                                                                                                                                                                                  border-radius: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                        padding: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                                              display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                                                                    justify-content: space-between;
                                                                                                                                                                                                                                                                                                                                                                                                                                                          align-items: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                gap: 8px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .num-item.active {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    border-color: #3b82f6;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          background: #111c30;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .num-main {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        font-weight: 700;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              font-size: 15px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .num-meta {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            font-size: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  color: #9ca3af;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        margin-top: 3px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .badge {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      font-size: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            padding: 4px 8px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  border-radius: 999px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        white-space: nowrap;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              font-weight: 600;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .badge.online {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            background: rgba(16, 185, 129, 0.15);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  color: #34d399;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .badge.soon {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                background: rgba(245, 158, 11, 0.15);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      color: #fbbf24;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .msg-item {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    border-bottom: 1px solid #243044;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          padding: 10px 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .msg-item:last-child {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        border-bottom: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .otp {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      display: inline-block;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            margin-top: 6px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  background: #1e3a8a;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        color: #93c5fd;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              padding: 2px 8px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    border-radius: 6px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          font-size: 13px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                font-weight: 700;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <h2 style="margin:0;">TempLine SMS</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <span id="numbersSummary" style="color:#9ca3af;font-size:14px;">Loading numbers...</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <h3 style="margin:0 0 10px;">ACTIVE NUMBERS</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="controls">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              id="numberSearch"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        type="search"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  placeholder="Search number, country (US, UK, IN), or status..."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            autocomplete="off"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    />
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button id="toggleAllNumbersBtn" class="secondary" type="button">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      Show All
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div id="numbersList" class="numbers-grid"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h3 style="margin:0 0 10px;">INBOX — <span id="selectedNumberLabel">All Numbers</span></h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div id="messagesList" style="color:#9ca3af;font-size:14px;">Loading messages...</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          let allNumbers = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              let showAll = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  let selectedNumber = null;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const numberSearchEl = document.getElementById('numberSearch');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const toggleBtnEl = document.getElementById('toggleAllNumbersBtn');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const numbersListEl = document.getElementById('numbersList');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const numbersSummaryEl = document.getElementById('numbersSummary');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const messagesListEl = document.getElementById('messagesList');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const selectedNumberLabelEl = document.getElementById('selectedNumberLabel');

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              function getFilteredNumbers() {
